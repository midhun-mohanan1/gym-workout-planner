<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing cyan gradient for the emblem -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Warm accent gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Outer subtle border ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Solid App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>

  <!-- Dumbbell Graphic (Diagonal Dynamic Angle) -->
  <g transform="rotate(-45 256 256)" filter="url(#glow)">
    <!-- Center Bar -->
    <rect x="238" y="140" width="36" height="232" rx="10" fill="#f8fafc"/>
    
    <!-- Grip ridges on the center handle -->
    <line x1="242" y1="236" x2="270" y2="236" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="246" x2="270" y2="246" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="256" x2="270" y2="256" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="266" x2="270" y2="266" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="242" y1="276" x2="270" y2="276" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Inner Plate Collars -->
    <rect x="228" y="162" width="56" height="12" rx="4" fill="url(#accentGrad)"/>
    <rect x="228" y="338" width="56" height="12" rx="4" fill="url(#accentGrad)"/>

    <!-- Main Outer Plates -->
    <rect x="206" y="132" width="100" height="28" rx="10" fill="url(#cyanGrad)"/>
    <rect x="206" y="352" width="100" height="28" rx="10" fill="url(#cyanGrad)"/>

    <!-- Outer Small Plates / End Caps -->
    <rect x="220" y="104" width="72" height="22" rx="8" fill="url(#cyanGrad)"/>
    <rect x="220" y="386" width="72" height="22" rx="8" fill="url(#cyanGrad)"/>
  </g>
</svg>
