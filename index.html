<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Comic Cardio — 5-Day Split</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111217;
    --surface:#1B1D24;
    --surface2:#23262F;
    --line:#2E313C;
    --text:#F4F3EF;
    --text-dim:#8C8FA0;
    --text-faint:#5B5E6B;
    --accent:#FF4C29;
    --accent-2:#FFC94A;
    --good:#57D08A;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:40px;min-height:100vh;}
  .mono{font-family:'JetBrains Mono',monospace;}

  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 75%, transparent);
    padding:18px 16px 8px;
  }
  .brand{font-family:'Bebas Neue',sans-serif; font-size:32px; letter-spacing:0.06em; color:var(--text);}
  .brand span{color:var(--accent);}
  .brand-sub{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.12em; margin-top:-4px;}

  .tabs{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 14px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:10px 14px; border-radius:10px; background:var(--surface);
    border:1px solid var(--line); cursor:pointer; text-align:left; min-width:80px;
  }
  .tab .tab-label{font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:0.04em; color:var(--text);}
  .tab .tab-day{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em;}
  .tab.active{background:var(--accent); border-color:var(--accent);}
  .tab.active .tab-label, .tab.active .tab-day{color:#181005;}

  main{padding:4px 16px 20px; max-width:640px; margin:0 auto;}

  .section-title{
    font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.04em;
    color:var(--text-dim); margin:22px 0 10px;
  }

  .warmup-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:6px 14px; margin-bottom:6px;
  }
  .warm-item{
    display:flex; align-items:flex-start; gap:10px; padding:11px 0; border-bottom:1px solid var(--line);
    font-size:14px; color:var(--text);
  }
  .warm-item:last-child{border-bottom:none;}
  .warm-item .dot{width:5px; height:5px; border-radius:50%; background:var(--accent-2); margin-top:8px; flex-shrink:0;}

  .ex-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px;
  }
  .ex-top{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .ex-name{font-size:16px; font-weight:700; color:var(--text); line-height:1.25;}
  .ex-meta{font-size:12px; color:var(--text-dim); margin-top:3px;}
  .ex-meta .mono{color:var(--accent-2);}
  .video-toggle{
    flex-shrink:0; display:flex; align-items:center; gap:6px; background:var(--surface2); border:1px solid var(--line);
    color:var(--text); font-size:12px; font-weight:600; padding:9px 12px; border-radius:9px; cursor:pointer;
    white-space:nowrap;
  }
  .video-toggle.has-video{background:var(--accent); border-color:var(--accent); color:#181005;}
  .video-toggle svg{width:13px; height:13px; flex-shrink:0;}

  .video-panel{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .video-embed-wrap{position:relative; width:100%; padding-bottom:56.25%; border-radius:10px; overflow:hidden; background:#000;}
  .video-embed-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .video-link-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .video-link-row a{color:var(--accent-2); font-size:12px; text-decoration:none; font-weight:600;}
  .video-link-actions{display:flex; gap:14px;}
  .video-link-actions button{background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; padding:0; font-family:'Inter',sans-serif;}
  .video-link-actions button:active{color:var(--accent);}

  .video-input-row{display:flex; gap:8px;}
  .video-input{
    flex:1; background:var(--surface2); border:1px solid var(--line); border-radius:8px; color:var(--text);
    font-size:13px; padding:10px 12px; min-width:0;
  }
  .video-input::placeholder{color:var(--text-faint);}
  .video-input:focus{outline:none; border-color:var(--accent);}
  .video-save{
    flex-shrink:0; background:var(--accent); border:none; color:#181005; font-weight:700;
    font-size:13px; padding:0 16px; border-radius:8px; cursor:pointer;
  }
  .video-hint{font-size:11px; color:var(--text-faint); margin-top:6px;}

  .cond-card{
    background:linear-gradient(135deg, var(--surface2), var(--surface));
    border:1px solid var(--accent-2); border-radius:var(--radius); padding:16px; margin-bottom:12px;
  }
  .cond-title{font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:0.03em; color:var(--accent-2);}
  .cond-specs{display:flex; gap:16px; margin-top:12px;}
  .cond-spec{flex:1;}
  .cond-spec .v{font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700;}
  .cond-spec .l{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}
  .cond-note{font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;}

  .coach-note{
    font-size:12px; color:var(--text-dim); background:var(--surface); border-left:3px solid var(--accent);
    padding:10px 12px; border-radius:0 8px 8px 0; margin:0 0 16px; line-height:1.5;
  }

  @media (min-width:640px){ .brand{font-size:38px;} }
</style>
</head>
<body>

<header>
  <div class="brand">RACK<span>ED</span>.</div>
  <div class="brand-sub">5-Day Split — Fat loss + Muscle</div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<script>
const DAYS = [
  {
    id:'d1', label:'DAY 1', sub:'Chest', title:'Day 1 — Chest + Triceps',
    warmup:['5 min cardio, easy pace','Shoulder circles — 10 each direction','Band external rotations — 10–15 reps','2–3 progressively heavier warm-up sets on bench'],
    exercises:[
      {id:'d1-bench', name:'Bench Press', sets:4, reps:'6–10'},
      {id:'d1-incline', name:'Incline Dumbbell Press', sets:3, reps:'8–12'},
      {id:'d1-fly', name:'Cable / Machine Chest Fly', sets:3, reps:'12–15'},
      {id:'d1-smithcgp', name:'Smith Machine Close-Grip Press', sets:3, reps:'8–12'},
      {id:'d1-pushdown', name:'Cable Triceps Pushdown', sets:3, reps:'10–15'},
      {id:'d1-ohext', name:'Overhead Triceps Extension', sets:2, reps:'10–15'},
    ],
    note:'Chest gets priority — bench first while you\'re fresh. Keep 1–2 reps in reserve on your top set.'
  },
  {
    id:'d2', label:'DAY 2', sub:'Back', title:'Day 2 — Back + Biceps',
    warmup:['5 min cardio, easy pace','Band pull-aparts — 15 reps','Light lat pulldowns — 15 reps','1–2 warm-up sets before your first heavy pull'],
    exercises:[
      {id:'d2-latpull', name:'Lat Pulldown', sets:4, reps:'6–10'},
      {id:'d2-row', name:'Chest-Supported Row', sets:3, reps:'8–12'},
      {id:'d2-tbar', name:'T-Bar Row', sets:3, reps:'8–12'},
      {id:'d2-strarm', name:'Straight-Arm Pulldown', sets:2, reps:'12–15'},
      {id:'d2-ezcurl', name:'EZ-Bar Curl', sets:3, reps:'8–12'},
      {id:'d2-hammer', name:'Hammer Curl', sets:3, reps:'10–15'},
    ],
    note:'Drive the row and pulldown with your elbows, not your hands — squeeze the shoulder blade at the end of each rep.'
  },
  {
    id:'d3', label:'DAY 3', sub:'Legs', title:'Day 3 — Legs + Abs',
    warmup:['5 min cycling, easy pace','Bodyweight squats — 10–15 reps','Hip hinges — 10 reps','Leg swings — 10 each leg','2–3 progressively heavier warm-up sets on your first compound lift'],
    exercises:[
      {id:'d3-legpress', name:'Leg Press / Squat', sets:4, reps:'6–10'},
      {id:'d3-hipthrust', name:'Hip Thrust', sets:3, reps:'8–12'},
      {id:'d3-legext', name:'Leg Extension', sets:3, reps:'10–15'},
      {id:'d3-legcurl', name:'Leg Curl', sets:3, reps:'10–15'},
      {id:'d3-calf', name:'Calf Raise', sets:4, reps:'12–20'},
      {id:'d3-crunchmachine', name:'Ab Crunch Machine', sets:3, reps:'10–15'},
      {id:'d3-knee', name:'Hanging Knee Raise', sets:2, reps:'12–15'},
    ],
    note:'The day most people rush. Don\'t. If you\'re new to lifting, take leg press over barbell squats until the movement feels automatic.'
  },
  {
    id:'d4', label:'DAY 4', sub:'Shldrs', title:'Day 4 — Shoulders + Traps',
    warmup:['5 min light cardio','Shoulder circles','Band pull-aparts — 15 reps','Light lateral raises — 15 reps','2 warm-up sets before shoulder press'],
    exercises:[
      {id:'d4-shoulderpress', name:'Shoulder Press Machine', sets:4, reps:'6–10'},
      {id:'d4-lateral', name:'Lateral Raise', sets:4, reps:'12–20'},
      {id:'d4-pecdeck', name:'Reverse Pec Deck', sets:3, reps:'12–20'},
      {id:'d4-facepull', name:'Face Pull', sets:3, reps:'12–20'},
      {id:'d4-shrug', name:'Barbell / Dumbbell Shrug', sets:3, reps:'10–15'},
    ],
    note:'Don\'t turn lateral raises into an ego lift. Slow, controlled reps beat heavier sloppy ones here — every time.'
  },
  {
    id:'d5', label:'DAY 5', sub:'Arms', title:'Day 5 — Arms + Conditioning',
    warmup:['5 min light cardio','Arm circles','Light band curls — 15 reps','1–2 warm-up sets'],
    exercises:[
      {id:'d5-curl', name:'Barbell or EZ-Bar Curl', sets:4, reps:'8–12'},
      {id:'d5-hammer', name:'Hammer Curl', sets:3, reps:'10–15'},
      {id:'d5-conccurl', name:'Cable or Concentration Curl', sets:2, reps:'12–15'},
      {id:'d5-cgb', name:'Close-Grip Bench or Skull Crushers', sets:4, reps:'8–12'},
      {id:'d5-ohext', name:'Overhead Triceps Extension', sets:3, reps:'10–15'},
      {id:'d5-pushdown', name:'Cable Triceps Pushdown', sets:2, reps:'12–15'},
    ],
    conditioning:{speed:'4–5 km/h', incline:'5–10%', duration:'20–30 min', note:'Moderate intensity — you should still be able to speak in short sentences.'},
    note:'Arms get a second, lighter touch this week through Day 1 and Day 2 already — this session is where they get the main volume.'
  },
];

let activeDay = 'd1';
let expandedIds = new Set();
let videos = {}; // { exerciseId: url }
let saveTimeout = null;

async function loadVideos(){
  try{
    const res = await window.storage.get('exercise-videos');
    videos = (res && res.value) ? JSON.parse(res.value) : {};
  }catch(e){
    videos = {};
  }
}

function saveVideos(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async ()=>{
    try{ await window.storage.set('exercise-videos', JSON.stringify(videos)); }
    catch(e){ console.error('save failed', e); }
  }, 300);
}

function getYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/watch\?v=([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/embed\/([a-zA-Z0-9_-]{11})/,
    /youtube\.com\/shorts\/([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){ const m = url.match(p); if(m) return m[1]; }
  return null;
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  DAYS.forEach(d=>{
    const el = document.createElement('div');
    el.className = 'tab' + (d.id===activeDay ? ' active' : '');
    el.innerHTML = `<div class="tab-label">${d.label}</div><div class="tab-day">${d.sub}</div>`;
    el.onclick = ()=>{ activeDay = d.id; renderTabs(); renderMain(); };
    tabs.appendChild(el);
  });
}

function renderVideoPanel(ex){
  const url = videos[ex.id] || '';
  const panel = document.createElement('div');
  panel.className = 'video-panel';

  if(url){
    const vid = getYouTubeId(url);
    if(vid){
      panel.innerHTML = `
        <div class="video-embed-wrap">
          <iframe src="https://www.youtube.com/embed/${vid}" title="${ex.name} form" allowfullscreen loading="lazy"></iframe>
        </div>
        <div class="video-link-row">
          <a href="${url}" target="_blank" rel="noopener">Open on YouTube ↗</a>
          <div class="video-link-actions">
            <button data-action="edit">Edit</button>
            <button data-action="remove">Remove</button>
          </div>
        </div>
      `;
    } else {
      panel.innerHTML = `
        <div class="video-link-row">
          <a href="${url}" target="_blank" rel="noopener">Open video link ↗</a>
          <div class="video-link-actions">
            <button data-action="edit">Edit</button>
            <button data-action="remove">Remove</button>
          </div>
        </div>
      `;
    }
    panel.querySelector('[data-action="remove"]').onclick = ()=>{
      delete videos[ex.id];
      saveVideos();
      renderMain();
    };
    panel.querySelector('[data-action="edit"]').onclick = ()=>{
      delete videos[ex.id];
      renderMain(true, ex.id);
    };
  } else {
    panel.innerHTML = `
      <div class="video-input-row">
        <input class="video-input" type="text" placeholder="Paste YouTube link for ${ex.name}">
        <button class="video-save">Save</button>
      </div>
      <div class="video-hint">Works with youtube.com or youtu.be links</div>
    `;
    const input = panel.querySelector('.video-input');
    const save = ()=>{
      const val = input.value.trim();
      if(val){
        videos[ex.id] = val;
        saveVideos();
        renderMain();
      }
    };
    panel.querySelector('.video-save').onclick = save;
    input.onkeydown = (e)=>{ if(e.key==='Enter') save(); };
  }
  return panel;
}

function renderMain(keepExpanded, focusId){
  const day = DAYS.find(d=>d.id===activeDay);
  const main = document.getElementById('main');
  main.innerHTML = '';

  const h = document.createElement('div');
  h.className = 'section-title';
  h.textContent = day.title;
  main.appendChild(h);

  const note = document.createElement('div');
  note.className = 'coach-note';
  note.textContent = day.note;
  main.appendChild(note);

  const wt = document.createElement('div');
  wt.className = 'section-title';
  wt.textContent = 'Warm-up';
  main.appendChild(wt);

  const wcard = document.createElement('div');
  wcard.className = 'warmup-card';
  day.warmup.forEach(text=>{
    const row = document.createElement('div');
    row.className = 'warm-item';
    row.innerHTML = `<div class="dot"></div><span>${text}</span>`;
    wcard.appendChild(row);
  });
  main.appendChild(wcard);

  const et = document.createElement('div');
  et.className = 'section-title';
  et.textContent = 'Workout';
  main.appendChild(et);

  day.exercises.forEach(ex=>{
    if(focusId===ex.id) expandedIds.add(ex.id);
    const hasVideo = !!videos[ex.id];
    const isExpanded = expandedIds.has(ex.id);

    const card = document.createElement('div');
    card.className = 'ex-card';
    const top = document.createElement('div');
    top.className = 'ex-top';
    top.innerHTML = `
      <div>
        <div class="ex-name">${ex.name}</div>
        <div class="ex-meta">${ex.sets} × <span class="mono">${ex.reps}</span> reps</div>
      </div>
      <button class="video-toggle ${hasVideo?'has-video':''}">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        ${hasVideo ? 'Form' : 'Video'}
      </button>
    `;
    top.querySelector('.video-toggle').onclick = ()=>{
      if(expandedIds.has(ex.id)) expandedIds.delete(ex.id);
      else expandedIds.add(ex.id);
      renderMain();
    };
    card.appendChild(top);

    if(isExpanded){
      card.appendChild(renderVideoPanel(ex));
    }
    main.appendChild(card);
  });

  if(day.conditioning){
    const ct = document.createElement('div');
    ct.className = 'section-title';
    ct.textContent = 'Conditioning';
    main.appendChild(ct);

    const cond = document.createElement('div');
    cond.className = 'cond-card';
    cond.innerHTML = `
      <div class="cond-title">Incline Treadmill Walk</div>
      <div class="cond-specs">
        <div class="cond-spec"><div class="v mono">${day.conditioning.speed}</div><div class="l">Speed</div></div>
        <div class="cond-spec"><div class="v mono">${day.conditioning.incline}</div><div class="l">Incline</div></div>
        <div class="cond-spec"><div class="v mono">${day.conditioning.duration}</div><div class="l">Duration</div></div>
      </div>
      <div class="cond-note">${day.conditioning.note}</div>
    `;
    main.appendChild(cond);
  }
}

(async function init(){
  await loadVideos();
  renderTabs();
  renderMain();
})();
</script>
</body>
</html>
